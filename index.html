<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4a3560">
  <title>YUYU.EXE</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="app">

  <!-- Top bar: gifts, stars, progress, pause, restart -->
  <header id="hud">
    <span class="hud-title">YUYU.EXE</span>
    <span id="giftCount" aria-live="polite">🎁 0/5</span>
    <span id="coinCount" aria-label="Puppies collected">🐶 0</span>
    <div id="progressWrap" role="progressbar" aria-label="Progress to the cake" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="progressBar"></div>
    </div>
    <button id="pauseBtn" class="px-btn" aria-label="Pause game">⏸</button>
    <button id="restartBtn" class="px-btn" aria-label="Restart game">↻</button>
  </header>

  <!-- Game screen: tap anywhere on the screen to jump -->
  <div id="stage">
    <canvas id="game" width="640" height="320" role="img" aria-label="YUYU.EXE game screen"></canvas>
    <div id="toast" aria-live="polite"></div>
  </div>
</main>

<!-- Start screen -->
<section id="startScreen" class="overlay">
  <div class="card">
    <h1 class="title">YUYU.EXE</h1>
    <p>A tiny birthday adventure. Skate, jump over obstacles and collect puppies and find 5 gifts!</p>
    <p class="small">📱 Tap the screen to jump (hold for a higher jump)<br>⌨️ Space / ↑ to jump &nbsp;|&nbsp; P pause &nbsp;|&nbsp; R restart</p>
    <button id="startBtn" class="px-btn big" aria-label="Start game">▶ START</button>
  </div>
</section>

<!-- Pause screen -->
<section id="pauseScreen" class="overlay hidden">
  <div class="card">
    <h2 class="title small-title">PAUSED</h2>
    <button id="resumeBtn" class="px-btn big" aria-label="Resume game">▶ RESUME</button>
  </div>
</section>

<!-- Gift popup -->
<section id="giftModal" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="giftTitle">
  <div class="card">
    <h2 id="giftTitle" class="title small-title"></h2>
    <img id="giftImg" alt="Gift photo">
    <div id="giftFallback" class="fallback hidden"><span>🎁</span><small>Photo coming soon…</small></div>
    <p id="giftMessage"></p>
    <p id="giftCaption" class="caption"></p>
    <button id="giftClose" class="px-btn big" aria-label="Close gift">OK ✨</button>
  </div>
</section>

<!-- Birthday finale -->
<section id="finale" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="finaleTitle">
  <canvas id="confetti"></canvas>
  <div class="card">
    <canvas id="cakeCanvas" width="240" height="120" aria-label="Pixel birthday cake"></canvas>
    <h2 id="finaleTitle" class="title small-title"></h2>
    <p id="finaleMessage"></p>
    <p id="finaleSign" class="caption"></p>
    <button id="replayBtn" class="px-btn big" aria-label="Play again">↻ PLAY AGAIN</button>
  </div>
</section>

<script src="js/script.js"></script>
</body>
</html>
